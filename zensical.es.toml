[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/es/"
site_description = "El administrador de archivos de doble panel para macOS"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/es"
site_dir     = "site/es"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "Bienvenido a ATBCmder" = "index.md" },
  { "Capítulo 1: Fundamentos y configuración de macOS" = "getting_started.md" },
  { "Capítulo 2: Navegación y pestañas de carpetas" = "navigation_and_tabs.md" },
  { "Capítulo 3: Operaciones de archivos y cola en segundo plano" = "file_operations.md" },
  { "Capítulo 4: Visor universal y editores integrados" = "viewers_and_editors.md" },
  { "Capítulo 5: Herramientas avanzadas y automatización" = "power_tools.md" },
  { "Capítulo 6: Sistemas de archivos virtuales y red" = "network_and_vfs.md" },
  { "Capítulo 7: Preferencias y personalización" = "preferences_and_customization.md" },
  { "Capítulo 8: Referencia maestra de atajos de teclado" = "keyboard_shortcuts.md" },
  { "Capítulo 9: Soluciones prácticas y resolución de problemas" = "faq_howtos.md" },
  { "Capítulo 10: Descarga e instalación" = "download.md" },
  { "Política de privacidad" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "es"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Português", link = "/pt/", lang = "pt" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Русский", link = "/ru/", lang = "ru" },
  { name = "Italiano", link = "/it/", lang = "it" }
]
