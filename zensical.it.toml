[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/it/"
site_description = "Il file manager a doppio pannello per macOS"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/it"
site_dir     = "site/it"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "Benvenuto in ATBCmder" = "index.md" },
  { "Capitolo 1: Concetti fondamentali e configurazione di macOS" = "getting_started.md" },
  { "Capitolo 2: Navigazione e schede delle cartelle" = "navigation_and_tabs.md" },
  { "Capitolo 3: Operazioni quotidiane sui file e coda in background" = "file_operations.md" },
  { "Capitolo 4: Visualizzatore universale ed editor integrati" = "viewers_and_editors.md" },
  { "Capitolo 5: Strumenti avanzati e automazione" = "power_tools.md" },
  { "Capitolo 6: File system virtuali e rete" = "network_and_vfs.md" },
  { "Capitolo 7: Preferenze e personalizzazione" = "preferences_and_customization.md" },
  { "Capitolo 8: Guida rapida alle scorciatoie da tastiera" = "keyboard_shortcuts.md" },
  { "Capitolo 9: Ricette pratiche e risoluzione dei problemi" = "faq_howtos.md" },
  { "Capitolo 10: Download e installazione" = "download.md" },
  { "Informativa sulla privacy" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "it"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Português", link = "/pt/", lang = "pt" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Русский", link = "/ru/", lang = "ru" },
  { name = "Italiano", link = "/it/", lang = "it" }
]
