[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/en/"
site_description = "The Dual-Panel File Manager for macOS"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/en"
site_dir     = "site/en"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "Welcome to ATBCmder" = "index.md" },
  { "Chapter 1: Fundamentals & macOS Setup" = "getting_started.md" },
  { "Chapter 2: Navigation & Folder Tabs" = "navigation_and_tabs.md" },
  { "Chapter 3: Daily File Operations & Background Queue" = "file_operations.md" },
  { "Chapter 4: Universal Lister & Built-in Editors" = "viewers_and_editors.md" },
  { "Chapter 5: Power Tools & Automation" = "power_tools.md" },
  { "Chapter 6: Virtual File Systems & Network" = "network_and_vfs.md" },
  { "Chapter 7: Preferences & Customization" = "preferences_and_customization.md" },
  { "Chapter 8: Master Keyboard Shortcut Reference" = "keyboard_shortcuts.md" },
  { "Chapter 9: Real-World Recipes & Troubleshooting" = "faq_howtos.md" },
  { "Chapter 10: Download & Installation" = "download.md" },
  { "Privacy Policy" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
palette     = [
  { scheme = "default", primary = "indigo", accent = "deep-purple", media = "(prefers-color-scheme: light)" },
  { scheme = "slate",   primary = "indigo", accent = "deep-purple", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Roboto", code = "Roboto Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "中文", link = "/zh/", lang = "zh" }
]
