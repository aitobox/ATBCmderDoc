[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/ko/"
site_description = "macOS용 듀얼 패널 파일 관리자"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/ko"
site_dir     = "site/ko"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "ATBCmder 에 오신 것을 환영합니다" = "index.md" },
  { "제1장: 기본 개념 및 macOS 설정" = "getting_started.md" },
  { "제2장: 내비게이션 및 폴더 탭" = "navigation_and_tabs.md" },
  { "제3장: 일상 파일 작업 및 백그라운드 큐" = "file_operations.md" },
  { "제4장: 만능 뷰어 및 내장 편집기" = "viewers_and_editors.md" },
  { "제5장: 고급 도구 및 자동화" = "power_tools.md" },
  { "제6장: 가상 파일 시스템 및 네트워크" = "network_and_vfs.md" },
  { "제7장: 환경설정 및 사용자 정의" = "preferences_and_customization.md" },
  { "제8장: 마스터 키보드 단축키 레퍼런스" = "keyboard_shortcuts.md" },
  { "제9장: 실전 문제 해결 및 레시피" = "faq_howtos.md" },
  { "제10장: 다운로드 및 설치 가이드" = "download.md" },
  { "개인정보 처리방침" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "ko"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Português", link = "/pt/", lang = "pt" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Русский", link = "/ru/", lang = "ru" },
  { name = "Italiano", link = "/it/", lang = "it" }
]

[project.markdown_extensions]
admonition = {}
gfm_admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid" }] }
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tilde" = {}
