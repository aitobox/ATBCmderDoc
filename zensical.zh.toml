[project]
site_name    = "ATBCmder 文档"
site_url     = "https://cmder.aitobox.com/zh/"
site_description = "macOS 双面板文件管理器使用指南"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/zh"
site_dir     = "site/zh"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "欢迎使用 ATBCmder" = "index.md" },
  { "第 1 章：新手起步与 macOS 系统设置" = "getting_started.md" },
  { "第 2 章：导航、标签页与视图模式" = "navigation_and_tabs.md" },
  { "第 3 章：日常文件操作与后台队列" = "file_operations.md" },
  { "第 4 章：全能查看器与内置编辑器" = "viewers_and_editors.md" },
  { "第 5 章：高阶工具与自动化" = "power_tools.md" },
  { "第 6 章：虚拟文件系统与网络" = "network_and_vfs.md" },
  { "第 7 章：偏好设置与个性化定制" = "preferences_and_customization.md" },
  { "第 8 章：快捷键速查掌中宝" = "keyboard_shortcuts.md" },
  { "第 9 章：实战场景指南与疑难解答" = "faq_howtos.md" },
  { "第 10 章：下载与安装指引" = "download.md" },
  { "隐私政策" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "zh"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate",   primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "中文", link = "/zh/", lang = "zh" }
]
