[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/zh/"
site_description = "macOS 双栏文件管理器与键盘流效率工具"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/zh"
site_dir     = "site/zh"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "欢迎使用 ATBCmder" = "index.md" },
  { "第 1 章：基础概念与 macOS 系统配置" = "getting_started.md" },
  { "第 2 章：极速导航与多标签工作区" = "navigation_and_tabs.md" },
  { "第 3 章：日常文件操作与后台异步队列" = "file_operations.md" },
  { "第 4 章：全能万用查看器与内置编辑器" = "viewers_and_editors.md" },
  { "第 5 章：高阶生产力工具与自动化" = "power_tools.md" },
  { "第 6 章：虚拟文件系统与网络互联" = "network_and_vfs.md" },
  { "第 7 章：偏好设置与深度个性化定制" = "preferences_and_customization.md" },
  { "第 8 章：终极快捷键全书" = "keyboard_shortcuts.md" },
  { "第 9 章：实战场景解决方案与故障排查" = "faq_howtos.md" },
  { "第 10 章：软件下载与安装指南" = "download.md" },
  { "隐私政策" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "zh"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Português", link = "/pt/", lang = "pt" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Русский", link = "/ru/", lang = "ru" },
  { name = "Italiano", link = "/it/", lang = "it" }
]

[project.markdown_extensions]
admonition = {}
gfm_admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid" }] }
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tilde" = {}
