[project]
site_name    = "ATBCmder"
site_url     = "https://cmder.aitobox.com/de/"
site_description = "Der Zwei-Fenster-Dateimanager für macOS"
repo_url     = "https://github.com/aitobox/ATBCmderDoc"
repo_name    = "ATBCmderDoc"
docs_dir     = "docs/de"
site_dir     = "site/de"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css        = ["stylesheets/extra.css"]

nav = [
  { "Willkommen bei ATBCmder" = "index.md" },
  { "Kapitel 1: Grundlagen & macOS-Einrichtung" = "getting_started.md" },
  { "Kapitel 2: Navigation & Ordner-Tabs" = "navigation_and_tabs.md" },
  { "Kapitel 3: Dateioperationen & Hintergrundwarteschlange" = "file_operations.md" },
  { "Kapitel 4: Universeller Betrachter & Editoren" = "viewers_and_editors.md" },
  { "Kapitel 5: Power-Tools & Automatisierung" = "power_tools.md" },
  { "Kapitel 6: Virtuelle Dateisysteme & Netzwerk" = "network_and_vfs.md" },
  { "Kapitel 7: Einstellungen & Anpassung" = "preferences_and_customization.md" },
  { "Kapitel 8: Tastaturkurzbefehle-Referenz" = "keyboard_shortcuts.md" },
  { "Kapitel 9: Praxislösungen & Fehlerbehebung" = "faq_howtos.md" },
  { "Kapitel 10: Download & Installation" = "download.md" },
  { "Datenschutzerklärung" = "privacy_policy.md" }
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "de"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
app_store_url = "https://apps.apple.com/app/atbcmder/id6792398333"
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Português", link = "/pt/", lang = "pt" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Русский", link = "/ru/", lang = "ru" },
  { name = "Italiano", link = "/it/", lang = "it" }
]
