name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Check Markdown list spacing
        run: python3 scripts/format_markdown_lists.py --check

      - name: Check Zensical configurations
        run: python3 scripts/generate_configs.py --check

      - name: Run language detector unit tests
        run: node scripts/test_language_detector.js

      - name: Build all documentation
        run: |
          for lang in $(python3 scripts/languages.py --codes); do
            echo "Building $lang documentation (zensical.$lang.toml)..."
            zensical build -f "zensical.$lang.toml"
          done

      - name: Copy Root Redirect and CNAME
        run: |
          cp root_index.html site/index.html
          [ -f CNAME ] && cp CNAME site/CNAME || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
